<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="event-bridge-title event-bridge-desc">
  <title id="event-bridge-title">Event bridge: AWS → Azure</title>
  <desc id="event-bridge-desc">Flujo de eventos: AWS EventBridge → Redpanda Connect (pipeline en YAML) → Azure Service Bus, la frontera entre nubes → microservicio .NET que escala horizontalmente. / Event flow: AWS EventBridge → Redpanda Connect (YAML pipeline) → Azure Service Bus, the boundary between clouds → horizontally scalable .NET microservice.</desc>
  <defs>
    <marker id="eb-arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#25ed9e"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="28" fill="#0b0e0d"/>
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="56" y="66" font-size="22" font-weight="700" letter-spacing="6">EVENT BRIDGE</text>
    <rect x="56" y="78" width="56" height="4" rx="2" fill="#25ed9e"/>

    <rect x="40" y="112" width="420" height="480" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="64" y="146" font-size="20" font-weight="700" letter-spacing="4" fill="#cfcfcf">AWS</text>
    <rect x="500" y="112" width="420" height="480" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="524" y="146" font-size="20" font-weight="700" letter-spacing="4" fill="#cfcfcf">AZURE</text>

    <rect x="72" y="176" width="356" height="112" rx="18" fill="#121716" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="96" y="214" font-size="20" font-weight="700" fill="#25ed9e">01</text>
    <text x="96" y="248" font-size="28" font-weight="800" letter-spacing="1">AWS EVENTBRIDGE</text>
    <text x="96" y="274" font-size="17" fill="#cfcfcf">origen · source</text>

    <line x1="250" y1="290" x2="250" y2="342" stroke="#25ed9e" stroke-width="3" marker-end="url(#eb-arrow)"/>

    <rect x="72" y="352" width="356" height="132" rx="18" fill="#121716" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="96" y="390" font-size="20" font-weight="700" fill="#25ed9e">02</text>
    <text x="96" y="424" font-size="28" font-weight="800" letter-spacing="1">REDPANDA CONNECT</text>
    <text x="96" y="452" font-size="17" fill="#cfcfcf">pipeline en YAML · YAML pipeline</text>
    <text x="96" y="474" font-size="17" fill="#cfcfcf">mapea y transforma · maps and transforms</text>

    <path d="M430 418 H496 V232 H522" fill="none" stroke="#25ed9e" stroke-width="3" stroke-linejoin="round" marker-end="url(#eb-arrow)"/>
    <line x1="480" y1="112" x2="480" y2="592" stroke="#25ed9e" stroke-width="3" stroke-dasharray="10 10"/>

    <rect x="532" y="176" width="356" height="112" rx="18" fill="#121716" stroke="#25ed9e" stroke-width="3"/>
    <text x="556" y="214" font-size="20" font-weight="700" fill="#25ed9e">03</text>
    <text x="556" y="248" font-size="28" font-weight="800" letter-spacing="1">AZURE SERVICE BUS</text>
    <text x="556" y="274" font-size="17" fill="#cfcfcf">frontera entre nubes · cloud boundary</text>

    <line x1="710" y1="290" x2="710" y2="342" stroke="#25ed9e" stroke-width="3" marker-end="url(#eb-arrow)"/>

    <rect x="532" y="352" width="356" height="132" rx="18" fill="#121716" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="556" y="390" font-size="20" font-weight="700" fill="#25ed9e">04</text>
    <text x="556" y="424" font-size="28" font-weight="800" letter-spacing="1">MICROSERVICIO .NET</text>
    <text x="556" y="452" font-size="17" fill="#cfcfcf">.NET microservice</text>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
      <rect x="556" y="500" width="96" height="56" rx="10"/>
      <rect x="664" y="500" width="96" height="56" rx="10"/>
      <rect x="772" y="500" width="96" height="56" rx="10" stroke-dasharray="6 6"/>
    </g>
    <text x="710" y="578" font-size="16" fill="#cfcfcf" text-anchor="middle">escala horizontal · scales out</text>
  </g>
</svg>
