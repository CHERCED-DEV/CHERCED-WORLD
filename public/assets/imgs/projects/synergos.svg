<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="synergos-title synergos-desc">
  <title id="synergos-title">Synergos: arquitectura por capas / layered architecture</title>
  <desc id="synergos-desc">CDN (recursos / resources) → Umbraco .NET (capa de composición / composition layer) → micro-frontends y Web Components en cualquier framework web / micro-frontends and Web Components on any web framework.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#25ed9e"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="28" fill="#0b0e0d"/>
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="56" y="66" font-size="22" font-weight="700" letter-spacing="6">SYNERGOS</text>
    <rect x="56" y="78" width="56" height="4" rx="2" fill="#25ed9e"/>

    <rect x="56" y="104" width="848" height="112" rx="18" fill="#121716" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="88" y="168" font-size="22" font-weight="700" fill="#25ed9e">01</text>
    <text x="150" y="156" font-size="38" font-weight="800" letter-spacing="2">CDN</text>
    <text x="150" y="192" font-size="24" fill="#cfcfcf">recursos · resources</text>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
      <rect x="708" y="138" width="44" height="44" rx="8"/>
      <rect x="768" y="138" width="44" height="44" rx="8"/>
      <rect x="828" y="138" width="44" height="44" rx="8"/>
    </g>

    <line x1="480" y1="218" x2="480" y2="252" stroke="#25ed9e" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="56" y="264" width="848" height="112" rx="18" fill="#121716" stroke="#25ed9e" stroke-width="3"/>
    <text x="88" y="328" font-size="22" font-weight="700" fill="#25ed9e">02</text>
    <text x="150" y="316" font-size="38" font-weight="800" letter-spacing="2">UMBRACO · .NET</text>
    <text x="150" y="352" font-size="24" fill="#cfcfcf">capa de composición · composition layer</text>

    <line x1="480" y1="378" x2="480" y2="412" stroke="#25ed9e" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="56" y="424" width="848" height="168" rx="18" fill="#121716" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="88" y="490" font-size="22" font-weight="700" fill="#25ed9e">03</text>
    <rect x="150" y="450" width="330" height="64" rx="32" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="315" y="490" font-size="22" font-weight="700" letter-spacing="1.5" text-anchor="middle">MICRO-FRONTENDS</text>
    <rect x="500" y="450" width="330" height="64" rx="32" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="665" y="490" font-size="22" font-weight="700" letter-spacing="1.5" text-anchor="middle">WEB COMPONENTS</text>
    <text x="150" y="560" font-size="24" fill="#cfcfcf">cualquier framework web · any web framework</text>
  </g>
</svg>
