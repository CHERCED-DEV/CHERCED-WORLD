<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
  <title id="t">Cómo llega un post al lector</title>
  <desc id="d">Cuatro pasos de izquierda a derecha: el MDX del post, los Server Components en el build, el HTML estático en la CDN y el lector, que lo ve sin JavaScript.</desc>
  <style>
    text { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
    .name { font-size: 20px; font-weight: 700; }
    .note { font-size: 14px; fill: #c9c9c9; }
    .box { fill: #0d0d0d; stroke: #ffffff; stroke-opacity: 0.35; stroke-width: 1.5; }
    .accent { stroke: #25ED9E; stroke-width: 3; fill: none; }
    .arrow { stroke: #25ED9E; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="320" rx="24" fill="#000000"/>
  <text class="label" x="40" y="52">CÓMO LLEGA UN POST AL LECTOR</text>
  <g>
    <rect class="box" x="40" y="92" width="190" height="168" rx="16"/>
    <path class="accent" d="M40 108v136"/>
    <text class="label" x="64" y="128">01</text>
    <text class="name" x="64" y="164">MDX</text>
    <text class="note" x="64" y="194">El texto y la meta</text>
    <text class="note" x="64" y="216">del post, versionados</text>
  </g>
  <path class="arrow" d="M238 176h26m-8-8 8 8-8 8"/>
  <g>
    <rect class="box" x="272" y="92" width="190" height="168" rx="16"/>
    <path class="accent" d="M272 108v136"/>
    <text class="label" x="296" y="128">02</text>
    <text class="name" x="296" y="164">Build</text>
    <text class="note" x="296" y="194">Server Components</text>
    <text class="note" x="296" y="216">arman cada página</text>
  </g>
  <path class="arrow" d="M470 176h26m-8-8 8 8-8 8"/>
  <g>
    <rect class="box" x="504" y="92" width="190" height="168" rx="16"/>
    <path class="accent" d="M504 108v136"/>
    <text class="label" x="528" y="128">03</text>
    <text class="name" x="528" y="164">HTML</text>
    <text class="note" x="528" y="194">Estático, servido</text>
    <text class="note" x="528" y="216">desde la CDN</text>
  </g>
  <path class="arrow" d="M702 176h26m-8-8 8 8-8 8"/>
  <g>
    <rect class="box" x="736" y="92" width="184" height="168" rx="16"/>
    <path class="accent" d="M736 108v136"/>
    <text class="label" x="760" y="128">04</text>
    <text class="name" x="760" y="164">Lector</text>
    <text class="note" x="760" y="194">Lo lee completo,</text>
    <text class="note" x="760" y="216">incluso sin JS</text>
  </g>
</svg>
